resources:
  pipelines:
    forwardstep_transformation_pipeline:
      name: forwardstep-transformation-pipeline
      serverless: true
      allow_duplicate_names: true
      tags:
        environment: ${bundle.target}

      root_path: ${workspace.file_path}/pipelines/transformation_pipeline

      catalog: ${var.forwardstep_catalog}
      schema: forwardstep

      configuration:
        forwardstep.catalog: ${var.forwardstep_catalog}

      libraries:
        - glob:
            include: ../../pipelines/transformation_pipeline/transformations/**
